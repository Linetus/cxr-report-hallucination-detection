name: tfm-radiology
channels:
  - pytorch
  - nvidia
  - huggingface
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # Deep Learning core
  - pytorch::pytorch=2.2.0
  - pytorch::torchvision=0.17.0
  - pytorch::torchaudio=2.2.0
  - pytorch::pytorch-cuda=12.1   # RTX 4070 (Ada Lovelace, CUDA 12.x — funciona con driver 13.x)

  # Scientific computing
  - numpy=1.26
  - scipy
  - scikit-learn
  - pandas
  - matplotlib
  - seaborn
  - pillow

  # NLP / Tokenizers
  - conda-forge::tokenizers

  # Notebooks
  - jupyterlab
  - ipywidgets
  - tqdm

  # Config
  - conda-forge::omegaconf
  - conda-forge::hydra-core

  - pip:
    # ML framework
    - pytorch-lightning==2.2.0
    - lightning==2.2.0

    # Hugging Face ecosystem
    - transformers==4.40.0
    - datasets==2.19.0
    - accelerate==0.29.0
    - evaluate==0.4.1
    - timm==0.9.16          # Vision Transformer (ViT) pretrained models

    # NLP metrics (rouge-score es dependencia de evaluate, no hace falta pinnearlo)
    - nltk==3.8.1
    - sacrebleu==2.4.0      # BLEU metric

    # XAI / Explainability
    - grad-cam==1.5.2       # Grad-CAM implementation
    - captum==0.7.0         # PyTorch interpretability

    # Image processing
    - albumentations==1.4.3
    - opencv-python-headless==4.9.0.80

    # Data & utilities
    - pydicom==2.4.4        # DICOM file support
    - pyarrow==15.0.2
    - h5py==3.11.0          # Efficient dataset storage
    - tensorboard==2.16.2
    - wandb==0.16.6         # Experiment tracking

    # Testing
    - pytest==8.1.1
    - pytest-cov==5.0.0
